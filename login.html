
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabourFlow Login</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="./styles.css">
</head>

<body class="bg-[#0f172a] text-slate-300 min-h-screen flex items-center justify-center p-4">
  <form id="f" class="bg-[#1e293b] border border-slate-700 rounded-xl shadow p-6 w-full max-w-sm space-y-4">
    <h1 class="text-xl font-bold text-white">Digital Labour Payment &amp; Hajiri System</h1>

    <input id="e" type="email" required placeholder="Email"
      class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2">

    <input id="p" type="password" required minlength="6" placeholder="Password"
      class="w-full bg-slate-900 border border-slate-600 rounded-lg p-2">

    <label class="flex gap-2 text-sm">
      <input id="r" type="checkbox" checked> Remember session
    </label>

    <button id="submit" type="submit"
      class="w-full bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg p-2">
      Sign in
    </button>

    <p id="m" class="text-red-400 text-sm"></p>
  </form>

  <script type="module">
    import { login } from "./js/auth.js";

    const form = document.getElementById("f");
    const email = document.getElementById("e");
    const password = document.getElementById("p");
    const remember = document.getElementById("r");
    const message = document.getElementById("m");
    const submit = document.getElementById("submit");

    form.addEventListener("submit", async event => {
      event.preventDefault();
      message.textContent = "";
      submit.disabled = true;
      submit.textContent = "Signing in...";

      try {
        const result = await login(email.value.trim(), password.value);
        localStorage.removeItem("labourflow_token");
        sessionStorage.removeItem("labourflow_token");

        const storage = remember.checked ? localStorage : sessionStorage;
        storage.setItem("labourflow_token", result.token);
        storage.setItem("labourflow_user", JSON.stringify(result.user));

        location.href = "dashboard.html";
      } catch (error) {
        message.textContent = error.message || "Unable to sign in.";
      } finally {
        submit.disabled = false;
        submit.textContent = "Sign in";
      }
    });
  </script>
</body>
</html>
